---
apiVersion: v1
kind: ServiceAccount
metadata: {name: arc-secret-sync, namespace: arc-canary}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: arc-secret-sync, namespace: arc-build}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: arc-secret-sync, namespace: arc-qualify}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: arc-github-app, namespace: arc-canary}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/mc-common-security/secrets/github-app-arc-id/versions/latest
        path: github_app_id
      - resourceName: projects/mc-common-security/secrets/github-app-arc-installation-id/versions/latest
        path: github_app_installation_id
      - resourceName: projects/mc-common-security/secrets/github-app-arc-pem/versions/latest
        path: github_app_private_key
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: arc-github-app, namespace: arc-build}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/mc-common-security/secrets/github-app-arc-id/versions/latest
        path: github_app_id
      - resourceName: projects/mc-common-security/secrets/github-app-arc-installation-id/versions/latest
        path: github_app_installation_id
      - resourceName: projects/mc-common-security/secrets/github-app-arc-pem/versions/latest
        path: github_app_private_key
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: arc-github-app, namespace: arc-qualify}
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: projects/mc-common-security/secrets/github-app-arc-id/versions/latest
        path: github_app_id
      - resourceName: projects/mc-common-security/secrets/github-app-arc-installation-id/versions/latest
        path: github_app_installation_id
      - resourceName: projects/mc-common-security/secrets/github-app-arc-pem/versions/latest
        path: github_app_private_key
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata: {name: arc-github-app, namespace: arc-canary}
spec:
  serviceAccountName: arc-secret-sync
  secretProviderClassName: arc-github-app
  secretObject:
    type: Opaque
    data:
      - {sourcePath: github_app_id, targetKey: github_app_id}
      - {sourcePath: github_app_installation_id, targetKey: github_app_installation_id}
      - {sourcePath: github_app_private_key, targetKey: github_app_private_key}
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata: {name: arc-github-app, namespace: arc-build}
spec:
  serviceAccountName: arc-secret-sync
  secretProviderClassName: arc-github-app
  secretObject:
    type: Opaque
    data:
      - {sourcePath: github_app_id, targetKey: github_app_id}
      - {sourcePath: github_app_installation_id, targetKey: github_app_installation_id}
      - {sourcePath: github_app_private_key, targetKey: github_app_private_key}
---
apiVersion: secret-sync.gke.io/v1
kind: SecretSync
metadata: {name: arc-github-app, namespace: arc-qualify}
spec:
  serviceAccountName: arc-secret-sync
  secretProviderClassName: arc-github-app
  secretObject:
    type: Opaque
    data:
      - {sourcePath: github_app_id, targetKey: github_app_id}
      - {sourcePath: github_app_installation_id, targetKey: github_app_installation_id}
      - {sourcePath: github_app_private_key, targetKey: github_app_private_key}
