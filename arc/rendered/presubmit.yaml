spec:
  githubConfigUrl: https://github.com/mindclade
  githubConfigSecret: arc-github-app
  runnerGroup: mindclade-arc-ci
  runnerScaleSetName: mindclade-arc-presubmit-spot
  maxRunners: 0
  minRunners: 0

  template:
    metadata:
      labels:
        mindclade.dev/runner-authority: presubmit-only
      annotations:
        mindclade.dev/credential-authority: none
        mindclade.dev/shared-cache-volume: prohibited
    spec:
      automountServiceAccountToken:
        false
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true"
        mindclade.dev/workload-class: arc-presubmit-spot
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds:
        120
      tolerations:
        - effect: NoSchedule
          key: scheduling.mindclade.dev/spot
          operator: Equal
          value: "true"
        - effect: NoSchedule
          key: scheduling.mindclade.dev/arc-presubmit
          operator: Equal
          value: "true"
      restartPolicy: Never
      serviceAccountName: mindclade-arc-presubmit-spot-gha-rs-no-permission
      containers:

      - name: runner
        command:
          - /home/runner/run.sh
        image:
          ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        resources:
          limits:
            cpu: "12"
            memory: 24Gi
          requests:
            cpu: "2"
            memory: 4Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
