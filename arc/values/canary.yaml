githubConfigUrl: https://github.com/mindclade
githubConfigSecret: arc-github-app
runnerGroup: mindclade-arc-artifact-authority
runnerScaleSetName: mindclade-arc-canary
minRunners: 0
maxRunners: 1
controllerServiceAccount: {namespace: arc-systems, name: arc-controller}
template:
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      iam.gke.io/gke-metadata-server-enabled: "true"
    securityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        command: [/home/runner/run.sh]
        resources:
          requests: {cpu: 250m, memory: 512Mi}
          limits: {cpu: "1", memory: 2Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true

