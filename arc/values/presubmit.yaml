# Dormant render fixture only. The image below is the vendored ARC runner fixture, not the
# unpublished Mindclade Nix runner image. The readiness validator requires zero capacity and
# rejects activation until the separately qualified image and every connected gate are recorded.
---
githubConfigUrl: https://github.com/mindclade
githubConfigSecret: arc-github-app
runnerGroup: mindclade-arc-ci
runnerScaleSetName: mindclade-arc-presubmit-spot
minRunners: 0
maxRunners: 0
annotations:
  mindclade.dev/activation-state: blocked
  mindclade.dev/readiness-contract: arc/presubmit-readiness.yaml
controllerServiceAccount: {namespace: arc-systems, name: arc-controller}
template:
  metadata:
    labels:
      mindclade.dev/runner-authority: presubmit-only
    annotations:
      mindclade.dev/credential-authority: none
      mindclade.dev/shared-cache-volume: prohibited
  spec:
    automountServiceAccountToken: false
    # DORMANT SPOT PRESUBMIT PLACEMENT. Runner pods execute untrusted pull-request code. The
    # Workload Identity selector below is a GKE metadata-server capability check, not a pool
    # selector. workload-class pins this scale set to the distinct infrastructure-live
    # 5-workloads/ci/nodepools/runner-spot pool.
    #
    # BOTH fields below are load-bearing and neither works alone. The toleration only *permits*
    # this pod onto the pool; they do not require it. The selector is the half that pins it. The
    # module-managed Spot taint prevents accidental placement by ordinary workloads and the custom
    # presubmit taint prevents every existing ARC release scale set from landing here.
    #
    # controller.yaml deliberately gets neither field. The ARC controller belongs on the system
    # pool: the component deciding what code runs must not follow that code onto its nodes.
    #
    # ROLLOUT ORDER. Apply and qualify the Spot pool before selecting this render. minRunners: 0 is
    # not a safety gate: a queued job can scale an active set from zero. The readiness contract
    # therefore also requires connected scheduling, interruption classification/retry, and tested
    # on-demand rollback evidence before activation.
    #
    # CAPACITY CEILING. The separate pool is bounded at eight n2-standard-8 nodes. At the reviewed
    # three 2-vCPU runners per node, that exactly covers the 24-runner activation target; GitOps
    # must not raise maxRunners without a paired infrastructure change and renewed cost/quota proof.
    nodeSelector:
      iam.gke.io/gke-metadata-server-enabled: "true"
      mindclade.dev/workload-class: arc-presubmit-spot
    tolerations:
      - key: scheduling.mindclade.dev/spot
        operator: Equal
        value: "true"
        effect: NoSchedule
      - key: scheduling.mindclade.dev/arc-presubmit
        operator: Equal
        value: "true"
        effect: NoSchedule
    securityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    terminationGracePeriodSeconds: 120
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        command: [/home/runner/run.sh]
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "12", memory: 24Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
