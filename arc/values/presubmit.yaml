# Dormant render fixture only. The image below is the vendored ARC runner fixture, not the
# unpublished Mindclade Nix runner image. The readiness validator requires zero capacity and
# rejects activation until the separately qualified image and every connected gate are recorded.
---
githubConfigUrl: https://github.com/mindclade
githubConfigSecret: arc-github-app
runnerGroup: mindclade-arc-ci
runnerScaleSetName: mindclade-arc-presubmit-cpu
minRunners: 0
maxRunners: 0
annotations:
  mindclade.dev/activation-state: blocked
  mindclade.dev/readiness-contract: arc/presubmit-readiness.yaml
controllerServiceAccount: {namespace: arc-systems, name: arc-controller}
template:
  metadata:
    labels:
      mindclade.dev/runner-authority: presubmit-only
    annotations:
      mindclade.dev/credential-authority: none
      mindclade.dev/shared-cache-volume: prohibited
  spec:
    automountServiceAccountToken: false
    nodeSelector:
      iam.gke.io/gke-metadata-server-enabled: "true"
    securityContext:
      runAsNonRoot: true
      seccompProfile: {type: RuntimeDefault}
    terminationGracePeriodSeconds: 120
    containers:
      - name: runner
        image: ghcr.io/actions/actions-runner:2.336.0@sha256:0cfdcc701ce933c6d243c6b0b2da767366dc9f2e99961d4c3754b0b78084cdda
        command: [/home/runner/run.sh]
        resources:
          requests: {cpu: "2", memory: 4Gi}
          limits: {cpu: "12", memory: 24Gi}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}
          runAsNonRoot: true
