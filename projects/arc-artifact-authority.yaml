---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: arc-artifact-authority
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  description: Dedicated ARC control plane and ephemeral artifact-authority runners.
  sourceRepos: [https://github.com/mindclade/gitops.git]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: arc-systems}
    - {server: https://kubernetes.default.svc, namespace: arc-canary}
    - {server: https://kubernetes.default.svc, namespace: arc-build}
    - {server: https://kubernetes.default.svc, namespace: arc-qualify}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
  namespaceResourceWhitelist:
    - {group: "", kind: ServiceAccount}
    - {group: actions.github.com, kind: AutoscalingRunnerSet}
    - {group: apps, kind: Deployment}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: secret-sync.gke.io, kind: SecretSync}
    - {group: secrets-store.csi.x-k8s.io, kind: SecretProviderClass}
  orphanedResources:
    warn: true
