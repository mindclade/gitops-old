---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  description: Deny-all replacement for the built-in default project.
  sourceRepos: []
  destinations: []
  clusterResourceBlacklist:
    - group: "*"
      kind: "*"
  namespaceResourceBlacklist:
    - group: "*"
      kind: "*"
  orphanedResources:
    warn: true
