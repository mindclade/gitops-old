---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
spec:
  description: Cluster platform, policy, identity, networking, and shared operators.
  sourceRepos:
    - https://github.com/mindclade/gitops.git
  destinations:
    - {server: https://kubernetes.default.svc, namespace: cert-manager}
    - {server: https://kubernetes.default.svc, namespace: external-secrets}
    - {server: https://kubernetes.default.svc, namespace: gatekeeper-system}
    - {server: https://kubernetes.default.svc, namespace: gmp-system}
    - {server: https://kubernetes.default.svc, namespace: kube-system}
    - {server: https://kubernetes.default.svc, namespace: mindclade-system}
    - {server: https://kubernetes.default.svc, namespace: 'platform-*'}
  clusterResourceWhitelist:
    - {group: "", kind: Namespace}
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
    - {group: admissionregistration.k8s.io, kind: MutatingWebhookConfiguration}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: storage.k8s.io, kind: StorageClass}
    - {group: scheduling.k8s.io, kind: PriorityClass}
    - {group: gateway.networking.k8s.io, kind: GatewayClass}
    - {group: cert-manager.io, kind: ClusterIssuer}
    - {group: templates.gatekeeper.sh, kind: ConstraintTemplate}
    - {group: constraints.gatekeeper.sh, kind: MindcladeDenyHoldoutMount}
    - {group: constraints.gatekeeper.sh, kind: MindcladeDisallowedTags}
    - {group: constraints.gatekeeper.sh, kind: MindcladePartnerAllowedUsers}
    - {group: constraints.gatekeeper.sh, kind: MindcladePrivilegedContainer}
    - {group: constraints.gatekeeper.sh, kind: MindcladeRequireImagePolicy}
    - {group: constraints.gatekeeper.sh, kind: MindcladeRequiredResources}
    - {group: constraints.gatekeeper.sh, kind: MindcladeWorkloadIdentity}
  namespaceResourceWhitelist:
    - {group: "*", kind: "*"}
  namespaceResourceBlacklist:
    - {group: "", kind: Secret}
  roles:
    - name: admin
      policies:
        - p, proj:platform:admin, applications, *, platform/*, allow
      groups:
        - mindclade:platform
  orphanedResources:
    warn: true
