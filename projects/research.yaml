---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: research
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  description: Non-production training, evaluation, preprocessing, and experiment workloads.
  sourceRepos: [https://github.com/Mindclade/gitops.git]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: 'research-*'}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: "*"}
    - {group: apps, kind: "*"}
    - {group: batch, kind: "*"}
    - {group: autoscaling, kind: "*"}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: monitoring.coreos.com, kind: "*"}
    - {group: external-secrets.io, kind: ExternalSecret}
    - {group: jobset.x-k8s.io, kind: JobSet}
    - {group: kueue.x-k8s.io, kind: "*"}
  namespaceResourceBlacklist:
    - {group: "", kind: Secret}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: rbac.authorization.k8s.io, kind: "*"}
  roles:
    - name: researcher
      policies:
        - "p, proj:research:researcher, applications, sync, research/*, allow"
      groups: [Mindclade:research]
  orphanedResources: {warn: true}
