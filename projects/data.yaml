---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: data
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  description: Data ingestion, curation, quality, and lakehouse workloads.
  sourceRepos: [https://github.com/mindclade/gitops.git]
  destinations:
    - {server: https://kubernetes.default.svc, namespace: 'data-*'}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: "", kind: "*"}
    - {group: apps, kind: "*"}
    - {group: batch, kind: "*"}
    - {group: autoscaling, kind: HorizontalPodAutoscaler}
    - {group: networking.k8s.io, kind: NetworkPolicy}
    - {group: policy, kind: PodDisruptionBudget}
    - {group: monitoring.coreos.com, kind: "*"}
    - {group: external-secrets.io, kind: ExternalSecret}
  namespaceResourceBlacklist:
    - {group: "", kind: Secret}
    - {group: "", kind: ResourceQuota}
    - {group: "", kind: LimitRange}
    - {group: rbac.authorization.k8s.io, kind: "*"}
  roles:
    - name: developer
      policies:
        - "p, proj:data:developer, applications, sync, data/*, allow"
      groups: [mindclade:data-platform]
  orphanedResources: {warn: true}
