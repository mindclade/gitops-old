---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
  generators:
    - git:
        repoURL: https://github.com/mindclade/gitops.git
        revision: main
        directories:
          - path: rendered/staging/platform-*
  template:
    metadata:
      name: 'staging-{{.path.basename}}'
      labels:
        mindclade.dev/environment: staging
        mindclade.dev/domain: platform
    spec:
      project: platform
      source:
        repoURL: https://github.com/mindclade/gitops.git
        targetRevision: main
        path: '{{.path.path}}'
        directory:
          recurse: true
          include: '*.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
        retry:
          limit: 5
          backoff: {duration: 10s, factor: 2, maxDuration: 5m}
