---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-self-management
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: argocd-administration
  source:
    repoURL: https://github.com/mindclade/gitops.git
    targetRevision: main
    path: bootstrap/profiles/standard
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [ServerSideApply=true, ApplyOutOfSyncOnly=true]
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 10m}

