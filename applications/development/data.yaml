---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mindclade/gitops.git
        revision: main
        directories:
          - path: rendered/development/data-*
  template:
    metadata:
      name: 'development-{{.path.basename}}'
      labels:
        mindclade.dev/environment: development
        mindclade.dev/domain: data
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: data
      source:
        repoURL: https://github.com/mindclade/gitops.git
        targetRevision: main
        path: '{{.path.path}}'
        directory:
          recurse: true
          include: '*.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ServerSideApply=true
          - ApplyOutOfSyncOnly=true
          - PruneLast=true
        retry:
          limit: 5
          backoff: {duration: 10s, factor: 2, maxDuration: 5m}
