#
# Promote only an immutable artifact selection. Environment-owned configuration is rendered
# independently, so development, staging, and production can retain intentional scale/policy
# differences while all three run the same qualified digest.
name: promote

on:
  workflow_dispatch:
    inputs:
      app:
        description: Application name, for example serving-api. Use "all" for all selections.
        type: string
        required: true
      from:
        description: Source environment
        type: choice
        options: [development, staging]
        default: staging
        required: true
      to:
        description: Target environment
        type: choice
        options: [staging, production]
        default: production
        required: true

permissions:
  contents: read

concurrency:
  group: promote-${{ inputs.to }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.to }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Validate dispatch inputs
        env:
          APP: ${{ inputs.app }}
          FROM_ENV: ${{ inputs.from }}
          TO_ENV: ${{ inputs.to }}
        run: |
          set -euo pipefail
          case "$FROM_ENV:$TO_ENV" in
            development:staging|staging:production) ;;
            *)
              echo "::error::$FROM_ENV to $TO_ENV is not an adjacent promotion path"
              exit 1 ;;
          esac
          if [ "$APP" != "all" ]; then
            case "$APP" in
              platform-*|serving-*|research-*|data-*|partner-*) ;;
              *)
                echo "::error::invalid application name: $APP"
                exit 1 ;;
            esac
            case "$APP" in
              */*|*..*|*[!a-z0-9-]*)
                echo "::error::application name contains unsafe characters: $APP"
                exit 1 ;;
            esac
          fi

      - id: selection
        name: Copy the immutable artifact selection
        env:
          APP: ${{ inputs.app }}
          FROM_ENV: ${{ inputs.from }}
          TO_ENV: ${{ inputs.to }}
        run: |
          set -euo pipefail
          result="$(nix develop .#ci --command python3 scripts/promote-artifacts.py \
            --source "deployments/$FROM_ENV.yaml" \
            --target "deployments/$TO_ENV.yaml" \
            --application "$APP" \
            --apply)"
          printf '%s\n' "$result"
          nix develop .#ci --command python3 scripts/validate-deployment-selections.py
          echo "apps=${result#*: }" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- "deployments/$TO_ENV.yaml"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Target already carries the selected artifact set."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open the promotion pull request
        if: steps.selection.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          APPS: ${{ steps.selection.outputs.apps }}
          FROM_ENV: ${{ inputs.from }}
          TO_ENV: ${{ inputs.to }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          branch="promote/${FROM_ENV}-to-${TO_ENV}-${RUN_NUMBER}-${RUN_ATTEMPT}"
          title="promote(${TO_ENV}): immutable artifacts from ${FROM_ENV}"

          git config user.name "mindclade-gitops[bot]"
          git config user.email "mindclade-gitops[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -- "deployments/$TO_ENV.yaml"
          git diff --cached --quiet && {
            echo "No artifact selection changed."
            exit 0
          }
          git commit -m "$title"

          # Configure credentials only after all third-party actions and generation steps have
          # completed. checkout intentionally did not persist the write token in git config.
          nix develop .#evidence --command gh auth setup-git
          git push origin "$branch"

          body_file="$(mktemp)"
          {
            printf '## Artifact promotion — %s → %s\n\n' "$FROM_ENV" "$TO_ENV"
            printf 'Applications: `%s`\n\n' "$APPS"
            cat <<'EOF'
          This PR copies only the application-to-release-record selection. The immutable v4
          record owns its named images, typed artifacts, qualification graph, compatibility,
          migration, and rollback lineage. The target environment keeps its own reviewed
          replicas, quotas, endpoints, and policy. After merge, the render workflow opens the
          separate generated-manifest PR containing the exact cluster delta.

          ### Before approving

          - [ ] The source environment has completed qualification and soak requirements.
          - [ ] The selected release records bind the expected immutable digests.
          - [ ] The target environment's capacity and compatibility gates are satisfied.
          - [ ] No deployment freeze is in effect.
          EOF
          } > "$body_file"
          sed -i 's/^          //' "$body_file"

          url="$(nix develop .#evidence --command gh pr create \
            --base main \
            --head "$branch" \
            --title "$title" \
            --body-file "$body_file")"
          echo "::notice::Opened promotion PR: $url"
