name: Nix qualification

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: '59 5 * * 1'

permissions:
  contents: read

concurrency:
  group: nix-qualification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix:
    name: nix
    uses: mindclade/.github/.github/workflows/reusable-nix-qualification.yml@ccae13968c4112aaa918accd08a5de0214cf58b1
    with:
      watch-path-regex: '(^|/)(flake\.nix|flake\.lock|[^/]+\.nix)$|^\.github/workflows/.*nix.*\.ya?ml$'
      ci-command: make validate
      enable-aarch64-linux: true
      enable-aarch64-darwin: true
      reproducibility-targets: .#checks.x86_64-linux.ci-shell
