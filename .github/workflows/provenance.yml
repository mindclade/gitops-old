# Verify the governed deployment authorization for each selected Mindclade artifact.
# Candidate PR files are data only: this workflow executes from the protected base branch.
name: provenance

on:
  pull_request_target:
    paths:
      - 'rendered/**'
      - 'deployments/**'
      - 'releases/**'
      - 'image-policy.yaml'
      - 'bootstrap/argocd-install.provenance.json'
      - 'bootstrap/components/**'
      - 'bootstrap/install-profiles/**'
      - 'bootstrap/profiles/**'
      - 'policy/constraints/require-image-policy.yaml'
      - 'contracts/release-handoff-policy.json'
      - '.github/workflows/provenance.yml'
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require the protected default branch for manual verification
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF" = refs/heads/main || {
            echo "::error::manual provenance verification must run from refs/heads/main"
            exit 1
          }

      - name: Refuse forked candidates
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::GitOps control-plane PRs must originate from a branch in ${GITHUB_REPOSITORY}."
            exit 1
          }

      - name: Check out trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Check out desired-state candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .candidate
          persist-credentials: false

      - id: connected
        name: Enforce the connected-evidence activation boundary
        env:
          REQUESTED: ${{ vars.GITOPS_CONNECTED_VALIDATION }}
          ATTESTOR_PROJECT: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT }}
          ATTESTOR: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR }}
        run: |
          set -euo pipefail
          if [[ "$REQUESTED" != "true" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Connected evidence is staged until GITOPS_CONNECTED_VALIDATION=true after identity apply."
            exit 0
          fi
          [[ -n "$ATTESTOR_PROJECT" && -n "$ATTESTOR" ]] || {
            echo "::error::Connected evidence activation requires both Binary Authorization trust-root variables."
            exit 1
          }
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - name: Read governed control-plane digest exceptions
        run: |
          set -euo pipefail
          nix develop ./.trusted#ci --command yq -o=json '.spec.unsigned' \
            .candidate/image-policy.yaml > unsigned-exceptions.json

      - name: Collect and validate image references
        run: |
          set -euo pipefail
          grep -rhoE 'image: *[^ ]+' .candidate/rendered/ 2>/dev/null \
            | awk '{print $2}' | tr -d '"' > rendered-images.txt || true
          nix develop ./.trusted#ci --command python3 \
            .trusted/scripts/validate-deployment-selections.py \
            --root .candidate --print-images > selected-images.txt
          nix develop ./.trusted#ci --command yq -r \
            '.images[] | .name + "@" + .digest' \
            .candidate/bootstrap/components/immutable-images/kustomization.yaml \
            > control-plane-images.txt
          sort -u rendered-images.txt selected-images.txt control-plane-images.txt > images.txt
          status=0
          while IFS= read -r img; do
            [[ -z "$img" ]] && continue
            [[ "$img" == *@sha256:* ]] || { echo "::error::$img is not digest-pinned"; status=1; }
          done < images.txt
          exit "$status"

      - id: handoff
        name: Select an exact reviewed handoff transition
        run: |
          set -euo pipefail
          nix develop ./.trusted#ci --command python3 \
            .trusted/scripts/select-release-handoff-transition.py \
            --policy .candidate/contracts/release-handoff-policy.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate complete release records for active images
        env:
          BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT }}
          BINAUTHZ_DEPLOYMENT_ATTESTOR: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR }}
        run: |
          set -euo pipefail
          attestor_args=()
          if [[ "${{ steps.connected.outputs.enabled }}" == "true" ]]; then
            attestor_args=(
              --expected-deployment-attestor-project "$BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT"
              --expected-deployment-attestor "$BINAUTHZ_DEPLOYMENT_ATTESTOR"
            )
          fi
          nix develop ./.trusted#ci --command python3 \
            .trusted/scripts/validate-release-metadata.py \
            --root .candidate \
            --images-file images.txt \
            --unsigned-exceptions-file unsigned-exceptions.json \
            --expected-build-signer-workflow-ref \
              "${{ steps.handoff.outputs.build-signer-workflow-ref }}" \
            --expected-qualification-signer-workflow-ref \
              "${{ steps.handoff.outputs.qualification-signer-workflow-ref }}" \
            --expected-deployment-signer-workflow-ref \
              "${{ steps.handoff.outputs.deployment-signer-workflow-ref }}" \
            "${attestor_args[@]}"

      # Acquire cloud credentials only after all candidate-controlled YAML and JSON has passed
      # trusted local validation.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        if: steps.connected.outputs.enabled == 'true'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_GITOPS_VERIFIER }}

      - name: Verify Binary Authorization deployment evidence
        if: steps.connected.outputs.enabled == 'true'
        env:
          BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR_PROJECT }}
          BINAUTHZ_DEPLOYMENT_ATTESTOR: ${{ vars.BINAUTHZ_DEPLOYMENT_ATTESTOR }}
        run: >-
          nix develop ./.trusted#evidence --command
          python3 .trusted/scripts/verify-release-evidence.py
          images.txt unsigned-exceptions.json

  incident:
    name: Open incident for evidence drift
    needs: verify
    if: ${{ failure() && github.event_name == 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open an incident issue when deployed evidence no longer verifies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title 'Deployed image failed provenance verification' \
            --repo "$GITHUB_REPOSITORY" \
            --label security --label incident --label gitops \
            --body "A GitOps image no longer satisfies provenance/SBOM/Binary Authorization evidence. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
