#
# Verify the exact release evidence produced by Mindclade's trusted build workflow.
# Candidate PR files are data only: this workflow executes from the protected base branch.
name: provenance

on:
  pull_request_target:
    paths:
      - 'rendered/**'
      - 'releases/**'
      - 'image-policy.yaml'
      - '.github/workflows/provenance.yml'
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: provenance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: read
      issues: write
    steps:
      - name: Refuse forked candidates
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "$HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" ]] || {
            echo "::error::GitOps control-plane PRs must originate from a branch in ${GITHUB_REPOSITORY}."
            exit 1
          }

      - name: Check out trusted tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
          path: .trusted
          persist-credentials: false

      - name: Check out desired-state candidate as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          path: .candidate
          persist-credentials: false

      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342  # v31.11.0
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = false

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PLAN }}
          service_account: ${{ vars.SA_GITOPS_VERIFIER }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3

      - name: Read third-party digest exemptions
        run: |
          set -euo pipefail
          nix develop ./.trusted#ci --command yq -r '.spec.unsigned[]?.prefix // empty' .candidate/image-policy.yaml \
            | sort -u > unsigned.txt

      - name: Collect and validate image references
        run: |
          set -euo pipefail
          grep -rhoE 'image: *[^ ]+' .candidate/rendered/ 2>/dev/null \
            | awk '{print $2}' | tr -d '"' | sort -u > images.txt || true
          status=0
          while IFS= read -r img; do
            [[ -z "$img" ]] && continue
            [[ "$img" == *@sha256:* ]] || { echo "::error::$img is not digest-pinned"; status=1; }
          done < images.txt
          exit "$status"

      - name: Validate complete release records for active images
        run: >-
          python3 .trusted/scripts/validate-release-metadata.py
          --root .candidate --images-file images.txt

      - name: Verify GitHub attestations and Binary Authorization evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          registries=$(cut -d/ -f1 images.txt | sort -u | grep -E 'docker\.pkg\.dev$' || true)
          for registry in $registries; do gcloud auth configure-docker "$registry" --quiet; done

          is_unsigned() {
            while IFS= read -r prefix; do
              [[ -z "$prefix" ]] && continue
              case "$1" in "$prefix"*) return 0 ;; esac
            done < unsigned.txt
            return 1
          }

          status=0
          while IFS= read -r img; do
            [[ -z "$img" ]] && continue
            if is_unsigned "$img"; then
              echo "approved third-party digest: $img"
              continue
            fi
            if ! gh attestation verify "oci://$img" \
                 --repo Mindclade/mindclade-internal-monorepo \
                 --signer-workflow Mindclade/.github/.github/workflows/reusable-oci-build.yml >/dev/null; then
              echo "::error::missing/invalid SLSA provenance for $img"; status=1; continue
            fi
            if ! gh attestation verify "oci://$img" \
                 --repo Mindclade/mindclade-internal-monorepo \
                 --signer-workflow Mindclade/.github/.github/workflows/reusable-oci-build.yml \
                 --predicate-type https://spdx.dev/Document/v2.3 >/dev/null; then
              echo "::error::missing/invalid SPDX SBOM attestation for $img"; status=1; continue
            fi
            digest="${img##*@}"
            project="$(cut -d/ -f2 <<<"$img")"
            if [[ -z "$project" || "$project" == "$img" ]]; then
              echo "::error::cannot derive Artifact Registry project from $img"; status=1; continue
            fi
            if ! gcloud container binauthz attestations list \
                 --project="$project" \
                 --attestor=build-attestor \
                 --attestor-project="$project" \
                 --artifact-url="$img" 2>/dev/null | grep -q "$digest"; then
              echo "::error::no Binary Authorization build attestation for $img"; status=1
            fi
          done < images.txt
          exit "$status"

      - name: Open an incident issue when deployed evidence no longer verifies
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue create \
            --title 'Deployed image failed provenance verification' \
            --repo "$GITHUB_REPOSITORY" \
            --label security --label incident --label gitops \
            --body "A GitOps image no longer satisfies provenance/SBOM/Binary Authorization evidence. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
