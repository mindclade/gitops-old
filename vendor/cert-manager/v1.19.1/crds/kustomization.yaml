---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [upstream.yaml]
patches:
  - target: {group: apiextensions.k8s.io, version: v1, kind: CustomResourceDefinition}
    patch: |-
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1sync-options
        value: Prune=false,Delete=false
