---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cert-manager-cainjector, namespace: cert-manager}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/component: cainjector, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/name: cainjector}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cert-manager, namespace: cert-manager}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/component: controller, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/name: cert-manager}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cert-manager-webhook, namespace: cert-manager}
spec:
  minAvailable: 1
  selector: {matchLabels: {app.kubernetes.io/component: webhook, app.kubernetes.io/instance: cert-manager, app.kubernetes.io/name: webhook}}
