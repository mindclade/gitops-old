---
schema_version: 1
repository: gitops
repository_class: production-control
visibility: internal
github:
  enterprise_url: https://github.com/enterprises/mindclade
  organization_url: https://github.com/mindclade
  repository_index_url: https://github.com/orgs/mindclade/repositories
  repository_url: https://github.com/mindclade/gitops
authority:
  - argocd-installation
  - argocd-configuration
  - kubernetes-desired-state
  - promotion
  - admission-policy
forbidden_authority:
  - gcp-resource-provisioning
  - container-builds
  - application-source
  - plaintext-secrets
required_paths:
  - AGENTS.md
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - SUPPORT.md
  - CODE_OF_CONDUCT.md
  - GOVERNANCE.md
  - CHANGELOG.md
  - LEGAL.md
  - LICENSE
  - NOTICE
  - .github/PULL_REQUEST_TEMPLATE.md
  - .github/MINDCLADE_PROPRIETARY_SOURCE_HEADER.txt
  - .kubernetes-version
  - bootstrap/argocd-install.yaml
  - bootstrap/argocd-install.provenance.json
  - bootstrap/components/immutable-images/kustomization.yaml
  - bootstrap/install-profiles/standard/kustomization.yaml
  - bootstrap/install-profiles/ha/kustomization.yaml
  - bootstrap/profiles/standard/kustomization.yaml
  - bootstrap/profiles/ha/kustomization.yaml
  - bootstrap/root-app.yaml
  - vendor/arc/LICENSE
  - vendor/cert-manager/LICENSE
  - applications
  - deployments
  - contracts/release-handoff-policy.json
  - contracts/release-metadata.schema.json
  - contracts/fixtures/release-handoff/manifest.json
  - contracts/fixtures/release-handoff/evidence/platform-contract-fixture/v1.0.0-contract-fixture.json
  - contracts/fixtures/release-handoff/releases/platform-contract-fixture/v1.0.0-contract-fixture.json
  - projects
  - projects/argocd-administration.yaml
  - policy
  - qualification
  - qualification/schemas/qualification-request-v1.schema.json
  - qualification/schemas/qualification-report-v2.schema.json
  - scripts/audit-production-estate.py
  - scripts/apply-artifact-selection.py
  - scripts/create-release-promotion.py
  - scripts/deterministic-qualification-archive.py
  - scripts/production_qualification.py
  - scripts/production_eligibility.py
  - scripts/release_contract.py
  - scripts/select-release-handoff-transition.py
  - scripts/validate-deployment-selections.py
  - scripts/validate-release-handoff.py
  - scripts/validate-release-metadata.py
  - tests/test_artifact_selection.py
  - tests/test_create_release_promotion.py
  - tests/test_deployment_selection_contract.py
  - tests/test_release_handoff.py
  - tests/test_release_handoff_transition.py
  - tests/test_production_eligibility.py
  - tests/test_validate_release_metadata.py
  - tests/fixtures/release-metadata-3.0.0.schema.json
  - .github/workflows/production-qualification-evidence.yml
  - .github/workflows/dr-evidence.yml
  - overlays/production.yaml
  - docs/disaster-recovery.md
  - docs/argocd-upgrade.md
  - docs/failed-sync.md
  - docs/freeze-and-emergency.md
  - docs/rollback.md
forbidden_paths:
  - .terraform
  - .terragrunt-cache
default_branch: main
change_model: pull-request
production_controls:
  required_reviews: true
  codeowners: true
  merge_queue: true
  immutable_actions: true
  oidc_only_cloud_authentication: true
