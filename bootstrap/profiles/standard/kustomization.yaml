---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../argocd-install.yaml
patches:
  # These three objects have distinct owners after cold start: the environment root owns SSO
  # and RBAC ConfigMaps, and the audited bootstrap path owns credential fields in argocd-secret.
  - path: ../patches/delete-argocd-cm.yaml
  - path: ../patches/delete-argocd-rbac-cm.yaml
  - path: ../patches/delete-argocd-secret.yaml
  - path: ../patches/delete-argocd-notifications-secret.yaml
