---
# Mirrors mindclade/.yamllint.yaml, with one addition.
extends: default

# rendered/ is kustomize output. Its indentation style is kustomize's business, not ours, and
# linting machine output against a hand-written style guide produces failures nobody can act
# on — the only "fix" would be post-processing the renderer's output, which would break the
# byte-identical promotion guarantee.
#
# rendered/ is checked by the things that actually matter for generated manifests:
# kubeconform for schema, gator for policy, and render.yml's re-render diff for integrity.
#
# policy/templates/vendor/ is upstream's code, byte-for-byte from gatekeeper-library. Its
# style is upstream's business — reformatting it to satisfy our linter would mean the next
# re-vendor produces a spurious diff, and a real upstream change would be buried in it.
# Leading **/ so these match whether yamllint runs from inside the repo (CI) or from a
# parent directory (a sweep across all repos). Bare `rendered/` only matches the former.
#
# bootstrap/argocd-install*.yaml is also upstream-vendored byte-for-byte. Its committed
# checksums and provenance record are the integrity controls; reformatting it would invalidate
# both and obscure upstream diffs.
ignore: |
  **/rendered/**
  **/vendor/**
  **/bootstrap/argocd-install*.yaml

rules:
  line-length: disable
  truthy:
    allowed-values: ["true", "false", "on"]
