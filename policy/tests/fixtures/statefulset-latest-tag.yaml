apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: latest-tag
  namespace: dev
spec:
  serviceName: s
  selector:
    matchLabels: {app: x}
  template:
    metadata:
      labels: {app: x}
    spec:
      containers:
        - name: app
          image: example.com/app:latest
          resources:
            limits: {cpu: "1", memory: 1Gi}
            requests: {cpu: "1", memory: 1Gi}
