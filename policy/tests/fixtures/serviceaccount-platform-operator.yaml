# Kueue reconciles the Kubernetes API and needs a projected Kubernetes token, not Google
# service-account impersonation. The application namespaces remain covered by the constraint.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kueue-controller-manager
  namespace: kueue-system
