apiVersion: apps/v1
kind: Deployment
metadata:
  name: malformed-digest
  namespace: dev
spec:
  selector:
    matchLabels: {app: malformed}
  template:
    metadata:
      labels: {app: malformed}
    spec:
      serviceAccountName: app
      containers:
        - name: app
          image: europe-west4-docker.pkg.dev/mc/containers/app@sha256:not-a-digest
