# The one shape the vendored templates DID handle. Kept so a future change that fixes the
# workload kinds by breaking the Pod path is caught.
apiVersion: v1
kind: Pod
metadata:
  name: latest-tag
  namespace: dev
spec:
  containers:
    - name: app
      image: example.com/app:latest
      resources:
        limits: {cpu: "1", memory: 1Gi}
        requests: {cpu: "1", memory: 1Gi}
