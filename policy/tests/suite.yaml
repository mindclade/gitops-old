---
# Does each constraint actually fire on each kind it claims to match?
#
# WHY THIS EXISTS. Four constraints were pointed at upstream Gatekeeper library templates
# whose rego reads containers from one place only:
#
#   input_containers[c] { c := input.review.object.spec.containers[_] }
#
# That is the Pod shape. Every constraint matched `Pod, Deployment, StatefulSet, DaemonSet,
# Job, CronJob` — and on all of those except Pod the containers live under
# `spec.template.spec.containers`. The rule found nothing and reported clean. `deny-privileged`,
# `deny-latest-tag`, `require-resource-limits` and `partner-namespace-isolation` were inert
# against every workload Argo actually syncs, for as long as they had existed.
#
# Nothing detected it. `gator test` passed, the constraints were present, the templates were
# present, and review saw a correct-looking policy. It surfaced only because a `:latest` image
# reached `rendered/production` and someone went looking for why the gate had not caught it.
#
# WHAT MAKES THIS SUITE DIFFERENT FROM `gator test`. That command asks "do the current
# manifests violate anything?" — a question whose answer is "no" both when the estate is clean
# and when the policy is broken. These cases ask the other question: "given an object that
# definitely violates, does the constraint say so?" Only the second one can fail on a broken
# template.
#
# THE NEGATIVE CASES ARE NOT PADDING. `deny-privileged` currently reports zero violations
# against the real manifests. Without a case proving it CAN fire, that zero is unreadable —
# it means either "no privileged containers exist" or "still broken", and those need to look
# different. Equally, a rule that fires on everything is as useless as one that fires on
# nothing, which is what the `-compliant` fixtures pin down.
#
#   gator verify policy/tests/suite.yaml
kind: Suite
apiVersion: test.gatekeeper.sh/v1alpha1
metadata:
  name: mindclade-policy
tests:
  # -------------------------------------------------------------------------------------
  # deny-latest-tag
  # -------------------------------------------------------------------------------------
  # The constraint the bug was demonstrated on: identical image, FIRES as a Pod and SILENT
  # as a Deployment. Every workload kind it claims is covered below.
  - name: deny-latest-tag
    template: ../templates/deny-latest-tag.yaml
    constraint: ../constraints/deny-latest-tag.yaml
    cases:
      - name: deployment-with-latest-is-denied
        object: fixtures/deployment-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: statefulset-with-latest-is-denied
        object: fixtures/statefulset-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: daemonset-with-latest-is-denied
        object: fixtures/daemonset-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: cronjob-with-latest-is-denied
        object: fixtures/cronjob-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: pod-with-latest-is-denied
        object: fixtures/pod-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: digest-pinned-deployment-is-allowed
        object: fixtures/deployment-compliant.yaml
        assertions:
          - violations: "no"
      - name: exact-reviewed-upstream-control-plane-image-is-allowed
        object: fixtures/deployment-exact-upstream-argocd.yaml
        assertions:
          - violations: "no"

  # -------------------------------------------------------------------------------------
  # deny-privileged
  # -------------------------------------------------------------------------------------
  - name: deny-privileged
    template: ../templates/deny-privileged.yaml
    constraint: ../constraints/deny-privileged.yaml
    cases:
      - name: privileged-deployment-is-denied
        object: fixtures/deployment-privileged.yaml
        assertions:
          - violations: "yes"
      # The case that makes the real-world zero readable.
      - name: unprivileged-deployment-is-allowed
        object: fixtures/deployment-compliant.yaml
        assertions:
          - violations: "no"

  # -------------------------------------------------------------------------------------
  # require-resource-limits
  # -------------------------------------------------------------------------------------
  - name: require-resource-limits
    template: ../templates/require-resource-limits.yaml
    constraint: ../constraints/require-resource-limits.yaml
    cases:
      - name: deployment-without-limits-is-denied
        object: fixtures/deployment-no-limits.yaml
        assertions:
          - violations: "yes"
      # `resources: {}` — present but empty, which is what a Helm chart emits when its values
      # file has no resource stanza. Pinned as a case because "the block exists" is an easy
      # thing for a future rewrite to mistake for "the block is populated".
      - name: empty-resources-block-is-denied
        object: fixtures/deployment-empty-resources.yaml
        assertions:
          - violations: "yes"
      # Requests without limits. Schedulable, and free to consume the whole node once
      # running — on a GPU node that is the expensive failure this constraint exists for, so
      # requests alone must not satisfy it.
      - name: requests-without-limits-is-denied
        object: fixtures/deployment-requests-only.yaml
        assertions:
          - violations: "yes"
      - name: fully-resourced-deployment-is-allowed
        object: fixtures/deployment-compliant.yaml
        assertions:
          - violations: "no"

  # -------------------------------------------------------------------------------------
  # require-image-policy
  # -------------------------------------------------------------------------------------
  # This one was already correct — it is first-party and reads every nesting. Covered anyway,
  # because it is the control BinAuthz depends on and "already correct" is a property that
  # needs re-checking on every edit, not a fact established once.
  - name: require-image-policy
    template: ../templates/require-image-policy.yaml
    constraint: ../constraints/require-image-policy.yaml
    cases:
      - name: tag-referenced-deployment-is-denied
        object: fixtures/deployment-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: tag-referenced-cronjob-is-denied
        object: fixtures/cronjob-latest-tag.yaml
        assertions:
          - violations: "yes"
      - name: digest-from-unapproved-registry-is-denied
        object: fixtures/deployment-unapproved-registry.yaml
        assertions:
          - violations: "yes"
      - name: malformed-digest-is-denied
        object: fixtures/deployment-malformed-digest.yaml
        assertions:
          - violations: "yes"
      - name: digest-pinned-deployment-is-allowed
        object: fixtures/deployment-compliant.yaml
        assertions:
          - violations: "no"

  # -------------------------------------------------------------------------------------
  # require-workload-identity
  # -------------------------------------------------------------------------------------
  - name: require-workload-identity
    template: ../templates/require-workload-identity.yaml
    constraint: ../constraints/require-workload-identity.yaml
    cases:
      - name: annotated-service-account-is-allowed
        object: fixtures/serviceaccount-workload-identity.yaml
        assertions:
          - violations: "no"
      - name: unbound-service-account-is-denied
        object: fixtures/serviceaccount-missing-workload-identity.yaml
        assertions:
          - violations: "yes"
      - name: namespace-default-service-account-may-exist
        object: fixtures/serviceaccount-default.yaml
        assertions:
          - violations: "no"
      - name: kubernetes-platform-operator-service-account-is-allowed
        object: fixtures/serviceaccount-platform-operator.yaml
        assertions:
          - violations: "no"
      - name: workload-with-dedicated-service-account-is-allowed
        object: fixtures/deployment-compliant.yaml
        assertions:
          - violations: "no"
      - name: workload-without-service-account-is-denied
        object: fixtures/deployment-missing-serviceaccount.yaml
        assertions:
          - violations: "yes"
      - name: workload-using-default-service-account-is-denied
        object: fixtures/deployment-default-serviceaccount.yaml
        assertions:
          - violations: "yes"

  # -------------------------------------------------------------------------------------
  # partner-namespace-isolation
  # -------------------------------------------------------------------------------------
  - name: partner-namespace-isolation
    template: ../templates/partner-allowed-users.yaml
    constraint: ../constraints/partner-namespace-isolation.yaml
    cases:
      - name: partner-workload-with-no-security-context-is-denied
        object: fixtures/deployment-partner-root.yaml
        assertions:
          - violations: "yes"
      # The override case. A pod-level-only check passes this while the container runs as
      # root, which is precisely the shape of miss this suite exists to catch.
      - name: container-overriding-pod-runasnonroot-is-denied
        object: fixtures/deployment-partner-container-override.yaml
        assertions:
          - violations: "yes"
      - name: non-root-partner-workload-is-allowed
        object: fixtures/deployment-partner-compliant.yaml
        assertions:
          - violations: "no"

  # -------------------------------------------------------------------------------------
  # deny-holdout-bucket-mount
  # -------------------------------------------------------------------------------------
  # This is the model-quality isolation boundary. The init-container case is deliberate:
  # staging the holdout before the trainer starts contaminates the model just as surely as
  # mounting it in the primary container. The CronJob case pins the deeper service-account
  # nesting used by the one workload that is allowed to read holdout data.
  - name: deny-holdout-bucket-mount
    template: ../templates/deny-holdout-mount.yaml
    constraint: ../constraints/deny-holdout-bucket-mount.yaml
    cases:
      - name: training-holdout-volume-is-denied
        object: fixtures/deployment-holdout-mount.yaml
        assertions:
          - violations: "yes"
      - name: init-container-holdout-command-is-denied
        object: fixtures/deployment-holdout-init-container.yaml
        assertions:
          - violations: "yes"
      - name: preprocessing-holdout-reference-is-denied
        object: fixtures/deployment-holdout-preprocessing.yaml
        assertions:
          - violations: "yes"
      - name: evaluator-name-in-wrong-namespace-is-denied
        object: fixtures/cronjob-holdout-wrong-namespace.yaml
        assertions:
          - violations: "yes"
      - name: evaluation-cronjob-is-allowed
        object: fixtures/cronjob-holdout-evaluation.yaml
        assertions:
          - violations: "no"
