---
# Every workload runs as a named service account bound to a Google identity through Workload
# Identity Federation. `default` may exist for namespace initialization, but workloads may
# not use it.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: MindcladeWorkloadIdentity
metadata:
  name: require-workload-identity
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["ServiceAccount", "Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet", "ReplicaSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces:
      # Google- and GitOps-managed control planes own their own identity lifecycle.
      - kube-system
      - gke-managed-system
      - gatekeeper-system
      - gmp-system
      - argocd
      # These pinned platform operators reconcile the Kubernetes API and deliberately use
      # projected Kubernetes service-account tokens. They do not require Google API access;
      # if one gains it later, bind that exact KSA/GSA in its owning source and qualification.
      - cert-manager
      - jobset-system
      - kueue-system
