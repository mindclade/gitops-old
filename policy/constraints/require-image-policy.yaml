---
# Structural prerequisite for the supply chain: only approved registries and immutable digests
# reach GKE's separate Binary Authorization deployment-attestation gate.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: MindcladeRequireImagePolicy
metadata:
  name: require-image-policy
spec:
  # deny. This one shipped at dryrun and was promoted; see policy/README.md for the process.
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["", "apps", "batch"]
        kinds: ["Pod", "Deployment", "StatefulSet", "DaemonSet", "Job", "CronJob"]
    excludedNamespaces:
      # Cluster components Google manages. Blocking these does not harden anything; it
      # prevents the node becoming ready.
      - kube-system
      - gatekeeper-system
      - gke-managed-system
      - gmp-system
  parameters:
    allowedRegistries:
      - europe-west4-docker.pkg.dev/
      - us-central1-docker.pkg.dev/
    exemptImages:
      - ghcr.io/dexidp/dex@sha256:b8469881d3cb3a73001506f0d3aaefecb9c45d2311c1e0f405d8ac538316c59d
      - public.ecr.aws/docker/library/haproxy@sha256:e11f034e651603f10a365e5ad5a0321825e18eded9620e40c4f4d6ae58419bfe
      - public.ecr.aws/docker/library/redis@sha256:08ad0b1d280850169a790dba1393ff7a90aef951fc19632cf4d3ce4f78e679ba
      - quay.io/argoproj/argocd@sha256:0deb1a1c917629b960ead995ae3b6069450a866992676599658687ef9a641ee8
