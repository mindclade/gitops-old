---
# Defence in depth behind the partner-isolated AppProject.
#
# The AppProject stops Argo creating a cross-namespace resource. This stops a workload doing
# it at runtime — a pod that already exists, mutated by an operator, or created by something
# other than Argo.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: MindcladePartnerAllowedUsers
metadata:
  name: partner-namespace-isolation
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["", "apps", "batch"]
        kinds: ["Pod", "Deployment", "StatefulSet", "Job", "CronJob"]
    namespaces: ["partner-*"]
  parameters:
    runAsUser:
      rule: MustRunAsNonRoot
    runAsGroup:
      rule: MustRunAs
      ranges: [{min: 1000, max: 65535}]
    supplementalGroups:
      rule: MustRunAs
      ranges: [{min: 1000, max: 65535}]
    fsGroup:
      rule: MustRunAs
      ranges: [{min: 1000, max: 65535}]
