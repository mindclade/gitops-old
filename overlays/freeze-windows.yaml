---
# Scheduled production freezes. The annual window is mirrored by the production AppProject
# sync-window patch, so GitHub blocks the merge and Argo blocks ordinary reconciliation.
annual:
  - start: "12-20"
    end: "01-05"
    reason: >-
      End-of-year holiday. Most of the team is away, so a bad deploy has both a longer
      time-to-detection and a smaller pool of people who can fix it.
